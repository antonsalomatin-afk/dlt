id: TASK-009
title: Add API authentication and user session
status: BUILDING
epic: Epic 2 — Telegram Entry and Authentication
priority: P1
objective: Establish the Fastify API authentication boundary and persist validated Telegram users.
acceptance:
  - An accepted session-strategy ADR exists before implementation.
  - API accepts raw signed initData and delegates validation to packages/telegram.
  - Invalid auth creates no user and returns a stable unauthorized response.
  - Valid identity upserts the unique Telegram user and updates lastSeenAt.
  - Server-issued authentication is bounded by the accepted session policy.
  - API input and response boundaries are runtime-validated and never expose bot tokens.
  - Real database integration tests cover user creation, repeated login and invalid login.
non_goals:
  - No question delivery, payments or production deployment.
files_allowed:
  - apps/api/**
  - packages/database/**
  - packages/shared/**
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tsconfig*.json
  - .env.example
  - README.md
  - tests/**
required_checks:
  - pnpm check
  - pnpm prisma validate
  - pnpm test:integration
dependencies:
  - TASK-008
supervisor_refinement_required:
  - Resolved by accepted ADR-004; apply its endpoint, token, expiry and integration-test contracts.
owner_decision_required: false
commit_hint: 'feat(api): authenticate Telegram users and issue sessions'

relevant_adrs:
  - ADR-003-init-data-policy.md
  - ADR-004-api-sessions.md


supervisor_refinement:
  - Implement POST /auth/telegram and GET /me exactly as ADR-004; return stable sanitized errors with no secrets or raw signed data.
  - Expiry comparison is exclusive (valid only when now is strictly before expiresAt); use injectable clock with deterministic tests.
  - Invalid body or invalid initData must cause no writes. Database failures must not leave a User/session partial transaction.
  - Tests use Fastify injection plus real local PostgreSQL, synthetic signed inputs and isolated test-owned records; no Telegram HTTP calls.
  - Include concurrent or repeated login consistency, preference preservation, missing/malformed/unknown/expired bearer tokens and digest-only storage.
  - Apply a forward-only migration; verify full migration chain on a fresh isolated local database.
  - Include source and tests in strict root gates. Keep generated client uncommitted; no deployment configuration.
