id: TASK-060
title: Use the daily question in the Mini App
status: REVIEWING
epic: Epic 8 — Telegram Engagement
objective: Let an authenticated learner open, answer and safely revisit today's stable Thailand-date practice question in the Mini App.
acceptance:
  - The authenticated Mini App offers a clear Today's question entry point from setup and ordinary practice without changing the saved vehicle or ordinary practice flow.
  - The daily view sends one guarded authenticated POST /practice/daily request, strictly validates the exact accepted response and renders only the immutable safe question snapshot.
  - An unanswered daily presentation can be answered once through the accepted practice answer endpoint and shows the normal correctness and explanation result without requesting another daily assignment.
  - Reopening an answered daily assignment shows a deterministic completed state and a route to history or ordinary practice without inventing or leaking an answer result.
  - Missing vehicle, no eligible content, session expiry, transport and malformed-response failures are safe and recoverable; late or duplicate actions cannot mutate an unmounted or different view.
  - Browser and source-level tests cover entry, request integrity, strict response validation, answering, completed replay, errors, race guards and ordinary-practice regressions.
