supervisor_refinement:
  - Add a dedicated authenticated daily view and an accessible Today's question action from the saved-vehicle setup state and ordinary practice navigation. Do not replace or automatically load ordinary practice, and do not create a daily assignment during authentication or vehicle selection.
  - Add a strict browser schema for the exact response `{ day, presentationId, answered, question }`: canonical Thailand calendar date `YYYY-MM-DD`, canonical lowercase UUID presentation ID, boolean answered and the accepted safe four-choice presentation question. Reject extra keys, unsafe question shapes and inconsistent identifiers. Add only the explicit same-origin `/practice/daily` rewrite.
  - On entering the view, send exactly one POST `/practice/daily` request with an empty JSON object, the in-memory bearer token, no-store caching and the accepted 15-second timeout. Use synchronous request guards and mounted/request identity guards so same-turn entry or retry actions cannot duplicate requests and late success, error or 401 responses after navigation do nothing.
  - While loading, show an accessible pending state. A validated unanswered response renders the immutable question and four choices with the accepted English, Thai and Russian fallback policy. Do not render correctness, source, lifecycle, category, concept or identity metadata.
  - Submit an answer through the existing exact POST `/practice/answer` boundary with the captured daily presentation ID and selected choice ID. Reuse the accepted strict answer response and identity/choice consistency validation, synchronous duplicate guard, pending disablement, timeout, session-expiry handling and safe malformed-response failure behavior. A valid result shows selected/correct styling and available explanation/trap explanation without loading another question.
  - A validated daily response with answered true shows the safe question snapshot and an explicit Today’s question is complete state, but no enabled choices and no inferred selected choice, correctness or explanation. Offer History and ordinary Practice actions. After answering successfully in the current mount, preserve the actual validated result until navigation.
  - A daily 409 Vehicle selection required returns to setup, clears only the locally confirmed selected vehicle and asks the learner to choose and save one. A 404 No questions available keeps a recoverable daily empty state. A 401 expires the session. Transport, timeout, other HTTP and malformed success retain a retryable safe state. Retry creates one fresh request only after the previous request has settled.
  - Leaving the daily view remains immediate and invalidates pending callbacks. Choice selection and answer submission use synchronous guards. Keep all daily state in mounted React memory; do not persist question, answer or token data in browser storage, URLs or logs.
  - Playwright coverage must prove setup and practice entry, exact daily request method/body/bearer header, loading and valid unanswered rendering, answer request/result/explanations, same-turn duplicate guards, completed replay without answer leakage, 401/404/409/other HTTP/transport/malformed response handling, retry, language fallback and late-response navigation safety. Preserve existing ordinary practice tests. Add focused source/contract coverage for the strict schema and rewrite.
  - Update concise Mini App documentation. No API, database, daily-assignment semantics, ordinary practice behavior, favorites/reports, bot command/message, reminder preference, scheduler/queue, push, summary, deep link, dependency, credential, production content or deployment change belongs in this task.
