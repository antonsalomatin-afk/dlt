id: TASK-012
title: Submit one answer per question presentation
status: ACCEPTED
epic: Epic 3 — Question Vertical Slice
priority: P1
objective: Score and persist an authenticated answer against the exact presented snapshot.
acceptance:
  - Submission requires an owned presentation and a choice included in that presentation.
  - Database uniqueness enforces exactly one submitted answer per presentation, including concurrent requests.
  - Score and explanation derive from the saved snapshot and remain stable if source content changes.
  - Result exposes correctness and explanation only after valid submission.
  - Foreign presentations, unknown choices and duplicate submissions return documented sanitized errors.
  - Answer history is persisted atomically; invalid submissions write nothing.
files_allowed:
  - apps/api/**
  - packages/database/**
  - packages/question-engine/**
  - packages/shared/**
  - package.json
  - pnpm-lock.yaml
  - tsconfig*.json
  - tests/**
  - README.md
non_goals:
  - No mock exam, progress UI or learning recommendations.
required_checks:
  - pnpm check
  - pnpm prisma validate
  - pnpm test:integration
dependencies:
  - TASK-011
supervisor_refinement_required:
  - Resolved by supervisor_refinement below.
owner_decision_required: false
commit_hint: 'feat(practice): persist one scored answer per presentation'

supervisor_refinement:
  - POST /practice/answer requires the existing bearer session and a strict body with presentationId and choiceId UUID strings only.
  - Invalid body or choice absent from the saved snapshot returns400 {error: Bad Request}; unknown and foreign presentations share404 {error: Presentation not found}; duplicate owned submission returns409 {error: Answer already submitted}. Authentication failures use the existing401 shape.
  - Successful response is200 with presentationId, selectedChoiceId, correctChoiceId, isCorrect, explanationThai, explanationEnglish, explanationRussian, trapExplanationThai, trapExplanationEnglish and trapExplanationRussian. Explanations remain nullable, taken solely from the saved validated snapshot.
  - Persist a UUID answer row linked uniquely to the owned presentation with selected choice UUID, correctness and submitted time. Database uniqueness is mandatory; no check-then-insert race without constraint handling.
  - Validate the saved versioned snapshot at submission. Corrupt snapshots produce sanitized500 and no answer. Do not recompute against current source question or choices.
  - Transactionally validate ownership and snapshot, insert answer and validate the result DTO; classify only the expected presentation uniqueness conflict as duplicate, keeping other errors sanitized500.
  - Test correct and incorrect answers, malformed requests, unknown choices, foreign ownership without disclosure, repeated submission and concurrent submissions with exactly one200 and one persisted row; later source edits must not change grading or explanations.
  - Invalid or duplicate submissions must not alter the persisted answer. Use no-store responses and test-owned synthetic records only. Verify forward migration and fresh isolated migration chain.



