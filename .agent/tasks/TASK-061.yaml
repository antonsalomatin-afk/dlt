id: TASK-061
title: Persist a daily-question reminder preference
status: READY
epic: Epic 8 — Telegram Engagement
objective: Give each authenticated learner an explicit, default-off persisted preference for future daily-question reminders.
acceptance:
  - An additive database migration stores one non-null default-off daily-question reminder boolean per user without changing existing identity, session or learning data.
  - GET /me/reminders authenticates the session and returns exactly the caller's current reminder preference.
  - PATCH /me/reminders authenticates before strict input parsing, accepts exactly one boolean preference and atomically returns the persisted value.
  - Invalid, unauthenticated and error paths do not mutate preferences or expose learner, Telegram, session or learning data.
  - Existing authentication, user, practice, exam and progress behavior remains unchanged.
  - Documentation and automated tests cover migration integrity, default state, enable/disable/idempotent updates, ownership, strict boundaries and failure safety.
files_allowed:
  - apps/api/**
  - packages/database/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm prisma validate
  - pnpm test:integration
dependencies:
