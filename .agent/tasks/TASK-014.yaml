id: TASK-014
title: Connect Mini App question and answer flow
status: BUILDING
epic: Epic 3 — Question Vertical Slice
objective: Display questions, submit one answer, show explanations and continue using the accepted API.
acceptance:
  - Fetch a presentation for the saved vehicle and render wording and four accessible answer choices without hidden correctness.
  - Submit only the selected presentation/choice IDs, prevent duplicate UI submission and render the validated server result and explanation.
  - Continue fetches a new presentation and clears previous choice/result; empty bank, expired session and network errors are recoverable.
  - Browser tests cover correct and incorrect results, continuation, empty bank, session expiry and duplicate/network failures.
files_allowed:
  - apps/web/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm build
  - pnpm test:e2e
  - pnpm test:integration
supervisor_refinement_required:
  - Resolved by supervisor_refinement below; apply ADR005.
dependencies:
  - TASK-013
owner_decision_required: false

supervisor_refinement:
  - Add explicit ADR005 rewrites only for /practice/next and /practice/answer; retain existing authenticated memory session.
  - Render normalized English by default; offer English/Russian/Thai wording controls with English fallback when translation is null. Exam English can be shown separately on request when available. Language choice is local UI state; do not add a persisted preference API.
  - Begin practice only after vehicle choice is saved. POST /practice/next with an empty object; validate complete strict presentation DTO before display.
  - Use radio-group answer selection and explicit Submit; no correctness or explanation is displayed until a validated successful answer response. Preserve the submitted choice in the result and identify the correct choice by stable ID, never position.
  - On success, show correct/incorrect text and localized explanation/trap explanation, with English fallback and a plain unavailable message when all relevant text is null.
  - While submitting, disable further submission. Transport failure leaves the presentation and selected choice visible with Retry; a409 retry result shows already-submitted guidance and allows a new question without inventing a score.
  - Continue clears prior result and selection only when starting the next request, and never submits an old presentation. Disable overlapping fetches and ignore stale responses after session loss or vehicle change.
  - Empty bank404 shows a friendly no-questions message without activating content; missing vehicle409 returns to selection. Authentication401 clears token/session. Malformed response and unknown errors show safe local recovery guidance.
  - Browser tests mock API only from test harness and cover correct/incorrect results, all four choices, language fallback, continuation, empty bank,401, failed submit retry409 and invalid DTO. No live content or Telegram credentials.
  - Validate answer response presentationId and selectedChoiceId against the submitted request, require correctChoiceId belongs to the current question and isCorrect agrees with the two choice IDs; inconsistent responses show recovery guidance instead of a result.

