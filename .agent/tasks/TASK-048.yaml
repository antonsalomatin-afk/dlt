id: TASK-048
title: Import validated candidate batches as inactive drafts
status: ACCEPTED
epic: Epic 7 — Content Operations
objective: Atomically import the accepted candidate-batch format into existing taxonomy as immutable, inactive DRAFT questions without activation or review approval.
acceptance:
  - A dedicated CLI revalidates one bounded local candidate batch before connecting to the database and imports it only into an explicitly configured loopback PostgreSQL database.
  - Every candidate resolves to existing category and concept slugs and is stored with exact candidate wording, choices, correctness and provenance as inactive, unreviewed DRAFT content.
  - Stable candidate-specific question and choice IDs make an exact reimport a safe no-op while any identity collision or changed content under the same batch identity fails without overwriting data.
  - The whole batch is transactional, so missing taxonomy, collisions or persistence failures leave no partial candidate import and preserve unrelated data.
  - Documentation and automated tests cover command use, immutable batch identity, successful import, exact reimport, rollback, collision and safe failure behavior.
files_allowed:
  - content/**
  - tools/content/**
  - tests/**
  - package.json
  - README.md
required_checks:
  - pnpm check
  - pnpm prisma validate
  - pnpm test:integration
dependencies:
  - TASK-047
owner_decision_required: false
