epic: Epic 8 — Telegram Engagement
objective: Let a Telegram user open ThaiDLT directly into the daily-question experience through bot-generated and Telegram startapp deep links.
acceptance:
  - The bot's private /start response preserves the existing Mini App launch and supports a validated daily destination parameter for the direct daily-question entry.
  - The Mini App reads only the Telegram-provided start parameter through the existing client boundary, validates an allowlisted daily destination, and routes an authenticated learner with a saved vehicle to the daily-question view.
  - A valid daily deep link never bypasses Telegram initData authentication, vehicle selection, or server-side daily-question authorization; missing authentication or vehicle state falls back to the existing safe setup flow.
  - Unknown, malformed, oversized or unsupported parameters deterministically fall back to setup without changing API authorization, persisted state or browser storage.
  - Bot-generated deep-link URLs and Telegram startapp links use the configured HTTPS Mini App URL/bot configuration without exposing credentials or trusting unsigned client identity.
  - Existing /start behavior, reminder buttons, ordinary practice, daily practice, exam flows and authentication contracts remain unchanged when no valid deep-link parameter is present.
  - Unit, browser and bot tests cover valid daily routing, malformed/unknown fallback, auth/vehicle gating, exact link construction, security boundaries and regressions.
owner_decision_required: false
owner_decision:
  - First deep-link slice targets the daily question because it is the launch-critical engagement flow.
  - Support both bot-generated links and Telegram startapp parameters.
  - Unknown or invalid deep links fall back to the normal setup screen.
