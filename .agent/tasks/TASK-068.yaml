supervisor_refinement:
  - Keep deep-link data as navigation intent only; never treat it as authentication or authorization evidence.
  - Use a small explicit allowlist and bounded parsing at the Mini App boundary. Do not add a new persistence system, dependency, credential or deployment integration.
