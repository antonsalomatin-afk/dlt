  - Include the requested question, answered-question and menu states with functional local interactions. Keep sample progress explicitly illustrative and show English by default.
  - Compare direct practice answer submission with an explicit confirmation alternative; these are proposals only. Mock-exam scoring or hidden correctness is not changed.
  - Fragment follows the complete visualize skill and is copied byte-for-byte to the thread visualization directory for discussion. No network calls, backend APIs, persistent browser storage, secrets, external asset dependency or production state.
  - Check literal markup/script syntax, primary interactions and responsive layouts down to320px. Independent preview review precedes presentation; original TASK-072 is not accepted based on a mockup.
