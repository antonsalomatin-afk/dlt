id: TASK-005
title: Create question domain schema
epic: Epic 1 — Data Foundation
status: BUILDING
priority: P1

objective: >
  Model categories, concepts, questions, localized text, choices and source/review
  metadata without yet implementing question delivery endpoints.

context:
  - The model must support Thai, exam-style English, normalized English and Russian.
  - The API must later be able to hide correctness before submission.

acceptance:
  - Vehicle type supports CAR and MOTORCYCLE.
  - Category can be assigned to questions.
  - Concept/variant grouping is representable.
  - Question stores the required language fields or a normalized localization structure.
  - Four-choice questions are representable.
  - Correct answer is stored server-side.
  - Source/review metadata is representable.
  - Question verification status is representable.
  - An image reference is optional.
  - Schema supports querying active verified questions by vehicle type/category.
  - Migration applies cleanly.
  - Tests verify key constraints.

non_goals:
  - Do not implement the API.
  - Do not build admin UI.
  - Do not implement spaced repetition.

files_allowed:
  - packages/database/**
  - packages/shared/**
  - package.json
  - pnpm-lock.yaml
  - tsconfig*.json
  - tests/**
  - README.md
  - .agent/ARCHITECTURE.md if needed

files_forbidden:
  - apps/web/**
  - apps/bot/**

required_tests:
  - Question can be created with four choices.
  - Invalid/duplicate structural conditions are rejected where enforced.
  - Query can select verified questions for a vehicle type.

required_checks:
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm prisma validate
  - pnpm test:integration

dependencies:
  - TASK-004

security_notes:
  - Model correctness metadata so it can remain server-only in delivery DTOs.

documentation:
  - README.md if developer commands change

commit_hint: "feat(db): model driving theory questions"

owner_decision_required: false

supervisor_refinement:
  - Use explicit typed language fields or validated localization; preserve Thai, exam English, normalized English and Russian distinctly.
  - Stable choice keys and per-question uniqueness must be enforced in PostgreSQL; category and concept references must have foreign keys.
  - Document which invariants are database-enforced and which require the next import boundary (such as exactly four choices if not database-enforced).
  - Store source type/reference/date, legal citation, reviewer/review date and verification state without claiming external content is licensed or verified.
  - Default new questions to inactive or unverified; verified active querying must exclude draft/inactive questions.
  - Keep correctness in database-only fields; no client DTO or delivery endpoint in this task.
  - Integration tests create their own records and clean only those records; cover duplicate choice key, invalid reference, active verified filtering and the four-choice multilingual case.
  - Apply the incremental migration and verify the full migration chain on an empty local verification database.
