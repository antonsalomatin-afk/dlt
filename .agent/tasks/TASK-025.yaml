id: TASK-025
title: Expose authenticated favorites feed
status: BUILDING
epic: Epic 4 — Learning
objective: Let an authenticated learner retrieve their saved favorite question snapshots in stable recency order.
acceptance:
  - A protected GET /me/favorites returns only the authenticated user's favorites newest first with bounded keyset pagination.
  - Each item is derived from the database-enforced immutable presentation anchor and exposes only the safe presented-question boundary.
  - Strict query, cursor, response and persisted-data integrity behavior is documented and tested.
  - PostgreSQL tests verify ownership, anchor replacement recency, pagination, removal exclusion, snapshot stability and corrupt-data failure.
files_allowed:
  - apps/api/**
  - packages/database/src/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm test:integration
supervisor_refinement_required:
  - Resolved by supervisor_refinement below; no further approval needed within this scope.
dependencies:
  - TASK-024
owner_decision_required: false
supervisor_refinement:
  - Add GET /me/favorites with Cache-Control no-store. Authenticate before strict query validation. Accept only optional canonical limit 1 through50 and a bounded opaque cursor; default20. Unknown, duplicate, padded, signed, fractional or out-of-range query values return400.
  - Order Favorite rows by updatedAt descending then favorite ID descending. Use keyset pagination with limit plus one and an opaque, versioned, canonical cursor carrying updatedAt and favoriteId. Cursors are navigation data and confer no ownership.
  - Query at the database boundary with Favorite.userId equal to the authenticated user and select only favorite id/updatedAt plus the anchored presentation id/snapshot. Do not fetch another user's rows for application-memory filtering.
  - Return strict { items, nextCursor }. Each item contains only presentationId, favoritedAt and the accepted safe presented question { id, localized wording, four localized choices }. Parse the anchored snapshot and derive question data only from it. Do not expose favorite/user IDs, correctness, explanations, answer state, source/image metadata or current mutable Question content.
  - Validate persisted integrity before returning any page: canonical database timestamp serialization, supported snapshot version/shape, snapshot question ID matching the Favorite.questionId and anchor presentation questionId, and anchor presentation userId matching Favorite.userId. Any contradiction fails the whole request with sanitized500.
  - Anchor replacement through POST /practice/favorite updates recency and causes the favorite to appear according to its new updatedAt with the newer owned presentation snapshot. Unfavorite removes it from subsequent feeds. No feed read mutates rows.
  - Unit tests cover strict response/cursor/query parsing and cursor canonicalization. Real PostgreSQL tests cover auth/query precedence, empty feed, ownership exclusion, deterministic tied ordering, two pages without gaps/duplicates, anchor replacement ordering/snapshot, unfavorite exclusion, immutable source edits, exact safe field boundary and fail-closed corrupt snapshot/relationship data where constraints permit.
  - Document pagination and immutable safe snapshot semantics. No UI, favorite mutation change, correctness/explanation reveal, schema migration, progress/mastery, new dependency, production credential or deployment change.
