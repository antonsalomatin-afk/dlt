id: TASK-050
title: Activate exact verified candidates through a traceable manifest
status: ACCEPTED
epic: Epic 7 — Content Operations
objective: Provide a separate, explicit local activation gate that can expose only exact VERIFIED candidate questions while preserving their content and review provenance.
acceptance:
  - A strict versioned activation manifest identifies one reviewed candidate batch, operator, activation time and unique candidate external IDs.
  - A dedicated CLI validates the candidate batch, review manifest and activation manifest completely before database access and targets only exact reviewed candidates in loopback PostgreSQL.
  - Eligible VERIFIED candidates become active by changing only the active flag; REJECTED, DRAFT, missing, drifted or differently reviewed content cannot be activated.
  - The activation set is transactional and exact replay is a safe no-op; any conflicting state aborts without partial activation or changes to unrelated data.
  - Documentation and automated tests cover the manifest chain, production-approval boundary, success, replay, rollback and safe failure behavior.
files_allowed:
  - content/**
  - tools/content/**
  - tests/**
  - package.json
  - README.md
required_checks:
  - pnpm check
  - pnpm prisma validate
  - pnpm test:integration
dependencies:
  - TASK-049
owner_decision_required: false
