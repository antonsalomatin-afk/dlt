supervisor_refinement:
  - Add `pnpm content:activate-candidates -- <candidate-batch-path> <review-manifest-path> <activation-manifest-path>`. Accept exactly three nonblank local JSON paths. Read all three through the bounded fatal-UTF-8 loader, parse once and strictly validate the complete candidate/review/activation chain before parsing DATABASE_URL, creating a client or writing. Keep all existing content commands unchanged.
  - Define activation manifest version 1 as exactly `{ version: 1, batchId, activatedBy, activatedAt, externalIds }`. batchId and each external ID use the accepted candidate key rule. activatedBy follows the reviewer's trimmed, control-free 1-200 character rule. activatedAt is canonical ISO UTC, is not earlier than the supplied review manifest reviewedAt and is not later than the command clock. externalIds contains 1-500 unique IDs.
  - Require matching batchId across all three documents. Every activation ID must exist in the candidate batch and have a VERIFIED decision in the supplied review manifest. Reject IDs absent from review decisions or carrying REJECTED. Validate these relationships before database access.
  - Require the existing loopback-only DATABASE_URL and Prisma client. In one Serializable transaction, resolve selected candidates' taxonomy, reconstruct their deterministic persisted representation, and require exact candidate-owned content, choices, correctness, provenance and taxonomy plus verificationStatus VERIFIED, reviewer and reviewedAt matching the supplied review manifest.
  - On first activation require active false, then update only active to true. Treat an exact already-active candidate as an idempotent match only when its complete content and review state still match. Any DRAFT/REJECTED/different review, missing row, content/choice/taxonomy/identity drift, or other inconsistency aborts the complete transaction. Do not update content, review fields, provenance, taxonomy, IDs or Prisma-owned timestamps directly.
  - Return a safe success summary containing batch ID and applied/matched activation counts. Every failure exits nonzero with one stable generic message and must not echo paths, operator/reviewer identity, source wording, decisions, SQL or credentials. Always disconnect a created client.
  - Add a fully synthetic activation-manifest example that targets a VERIFIED decision in the existing synthetic examples, but never execute it against repository or production data. Document that the manifest is an operator assertion and source-control artifact; it does not itself establish legal permission, official accuracy or Product Owner production approval.
  - Unit and CLI tests cover strict manifest fields, bounds, time/batch/external-ID/review relationships, duplicate and REJECTED IDs, pre-database validation, safe output and database configuration failures. Isolated PostgreSQL tests cover activation of exact VERIFIED candidates, exact replay without updatedAt change, DRAFT/REJECTED/missing/differently reviewed candidates, content/choice/taxonomy drift, multi-record rollback and preservation of unrelated and fixture data.
  - No schema/migration, real content activation, production database access, legal approval, review decision creation/replacement, deactivation, content/taxonomy/provenance mutation, admin API/UI, authentication change, network fetch, new dependency, credential or deployment change.
