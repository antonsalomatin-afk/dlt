supervisor_refinement:
  - Add a database enum with exactly `ENGLISH`, `RUSSIAN` and `THAI`, plus non-null `preferredLanguage` on User with database and Prisma default `ENGLISH`. The additive migration must preserve every existing user, session, learning, reminder, presentation, answer, exam, favorite and report row and relation.
  - Add strict shared request/response contracts for exactly `{ preferredLanguage: 'ENGLISH' | 'RUSSIAN' | 'THAI' }`. Do not infer preference from Telegram profile data or current per-screen React language state.
  - Add authenticated `GET /me/language` and `PATCH /me/language`. Authenticate before duplicate-key JSON parsing, media-type, query and body validation. GET accepts no body or query. PATCH requires one ordinary JSON object and an empty query. Ownership derives only from the authenticated internal user ID.
  - A valid PATCH atomically sets and returns the requested language. Repeating the same language is successful and idempotent. Independent users remain isolated, and concurrent writes use ordinary last-committed-write behavior while each response reflects its own database write.
  - Return established sanitized 401, 400/415 and 500 behavior. Malformed, duplicate-key, invalid-enum, unauthenticated, expired-session and injected database-failure paths write nothing. Responses expose only the preferred-language enum and no identity, Telegram, token/session, reminder, time, vehicle or activity data.
  - Keep login, `/me`, `/me/reminders`, progress and every accepted learning DTO unchanged. Do not automatically change or persist existing Mini App screen selectors in this task.
  - Unit tests cover exact contracts and no-store classification. Isolated migrated-PostgreSQL tests cover legacy/new-user English defaults, all three values, idempotence, authentication and validation precedence, ownership, concurrency, invalid/error rollback, response privacy and preservation of existing relations and endpoints.
  - Update concise API and data-model documentation. No Mini App language setting, Telegram message, reminder timing, scheduler/queue, delivery ledger, deep link, dependency, credential, production data or deployment change belongs in this task.
