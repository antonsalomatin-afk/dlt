id: TASK-063
title: Persist the learner's preferred language
status: ACCEPTED
epic: Epic 8 — Telegram Engagement
objective: Persist one authenticated learner language preference for future settings and Telegram messages, with English as the default.
acceptance:
  - An additive database migration stores one non-null preferred language per user with exactly ENGLISH, RUSSIAN or THAI and defaults existing and new users to ENGLISH.
  - GET /me/language authenticates the session and returns exactly the caller's persisted preferred language.
  - PATCH /me/language authenticates before strict input parsing, accepts exactly one supported preferred language and atomically returns the persisted value.
  - Invalid, unauthenticated and error paths do not mutate preferences or expose learner, Telegram, session or learning data.
  - Existing authentication, reminder, user, practice, exam and progress contracts remain unchanged.
  - Documentation and automated tests cover migration integrity, English defaults, all supported updates, idempotence, ownership, strict boundaries and failure safety.
files_allowed:
  - apps/api/**
  - packages/database/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm prisma validate
  - pnpm test:integration
dependencies:
  - TASK-062
owner_decision_required: false
owner_decision:
  - Use the learner's persisted preferred language for messages, with English as the default.
