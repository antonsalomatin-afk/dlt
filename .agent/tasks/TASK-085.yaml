id: TASK-085
title: Enrich immutable presentations from the independently reviewed bilingual pack
status: BUILDING
owner_role: Builder
depends_on:
  - TASK-084
objective: Make accepted translations and teaching available in new source-matching presentation snapshots without modifying the question bank, schema, history or pre-answer secrecy.
adr: .agent/decisions/ADR-009-bilingual-chat-teaching.md
acceptance:
  - Runtime-validate the actual shipped pack, three source files and independent TASK084 content manifest using bounded static module-relative paths, without network calls/runtime AI or caller-supplied paths. Canonical source/pack hashes,100 unique identities, each entry/source-question/accepted-stem-record hash, correct keys, complete per-entry semantic PASS/read declarations and exact optional-statute status must all match. Enforce strict content/manifest shape, valid UTC chronology and safe bounded text/URLs. Reject corrupted, partial, stale, unreviewed or mismatched artifacts before use; do not synthesize a review. Current pack SHA1465c7a1b6800b53a5172bf26dea7dffbc787ff6887dcd5894a9a31e23165c29.
  - Reuse or extract existing canonical JSON hash and stable candidate question/choice UUID helpers into an appropriate server-only shared helper, preserving all existing public tool exports and every accepted ID/hash. No package dependency upgrade or packages-to-tools runtime dependency.
  - Enrich only exact eligible launch source matches including stable question/choice IDs, vehicle, English/Thai/exam text, choice keys/text/answer flags, original explanation/trap fields, source metadata/citation and accepted Russian stem. Existing missing Russian translations may receive reviewed values in the NEW snapshot; conflicting existing translations must never be silently overwritten. Unrelated or drifted questions keep their existing un-enriched behavior, never stale notes. All100 unchanged current source records with accepted stems must match and enrich.
  - Keep strict version1 snapshot parsing backwards-compatible via optional validated teaching metadata. Copy accepted choice/explanation Russian text into existing snapshot translation fields and retain full immutable bilingual distractor/safety/guidance, optional typed statute and pack/review provenance in hidden teaching metadata. Do not update original Question/QuestionChoice rows or historical presentations/attempts. English wording, correct answer, concept credit and option order unchanged.
  - Existing pre-answer HTTP presentation DTOs must still exclude correctChoiceId, explanations, hidden teaching and legal/distractor/safety text. Existing post-answer DTO shape/scoring/authentication unchanged. Do not modify exam persistence/secrecy/timers, bot transport/rendering, user preferences or reminders in this task. New practice snapshots may expose their now-complete RU question/choice translations through existing public fields.
  - Meaningful tests cover real100pack/400choices/2boundedstatute examples, actual100entry review manifest, content/source/review tampering and duplicate/missing/status/time cases, exact immutable ID/hash compatibility, source/translation drift, noneligible/unrelated records, legacy snapshots, new snapshot persistence and pre-answer non-disclosure. Run required full gates before Builder commit; independent source Reviewer PASS before accept. Publication and Telegram renderer remain later tasks.
manifest_note: stemSha256 hashes the ENTIRE accepted translation record containing batchId/externalId/textRussian, not only the text string. Source-question hash covers the entire original candidate question; entrySha256 covers the full teaching entry. Preserve the actual manifest contract; inspect its keys/programmatically, avoid printing all100 already-reviewed entries.
files_allowed:
  - packages/database/src/teaching.ts
  - packages/database/src/content-identity.ts
  - packages/database/src/presentation.ts
  - tools/content/candidate-import.ts
  - tools/content/russian-stems.ts
  - tests/teaching.test.ts
  - tests/teaching.integration.test.ts
  - tests/presentation.test.ts
  - tests/candidate-import.test.ts
  - tests/russian-stems.test.ts
  - README.md
  - .local-content/task085*
  - .local-content/TASK-085*
files_forbidden:
  - apps/**
  - packages/database/prisma/**
  - content/**
  - .agent/reviews/TASK-084*
  - .agent/STATE.json
  - .agent/tasks/**
  - .env
  - pnpm-lock.yaml
required_checks:
  - pnpm lint
  - pnpm typecheck
  - pnpm test --maxWorkers=4
  - pnpm db:ready
  - pnpm test:integration
  - pnpm build
  - git diff --check
scope_rule: One snapshot/content-loader task only. Ask Supervisor before scope expansion. Do not implement bot UI or deploy, do not mutate actual source bank/old snapshots, preserve three original untracked files. JS administrative scratch uses .mjs.txt, never lint-visible .mjs/.js.
