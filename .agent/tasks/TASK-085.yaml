implementation_clarification:
  - snapshotQuestion is shared with exam creation. Preserve its existing direct-call default payload; add an explicit backward-compatible teaching opt-in used for new practice/daily/private/group presentations. Existing exam callers and snapshots stay un-enriched; no exam call-site change. Tests prove both default and opt-in boundaries.
  - Supervisor scope amendment permits only the new-practice snapshot call in daily-practice.ts and the mistake-retry snapshot call in apps/api/src/index.ts to pass the explicit teaching opt-in. The separate exam snapshot call in that API file must remain untouched. No auth, route, retry eligibility/scoring, exam or daily-selection logic refactor. Add meaningful default/opt-in coverage; existing full regression gates still mandatory.

