id: TASK-065
title: Define daily Telegram reminder delivery policy
status: BLOCKED
epic: Epic 8 — Telegram Engagement
objective: Define the learner-visible policy required before implementing daily Telegram reminder delivery.
acceptance:
  - Product Owner chooses one Thailand-local daily send time.
  - Product Owner chooses whether an enabled reminder is suppressed after the learner completes that day's daily question.
  - The chosen policy is recorded before any scheduler, delivery ledger, bot message or production integration task is started.
files_allowed: []
required_checks: []
dependencies:
  - TASK-061
  - TASK-062
  - TASK-063
  - TASK-064
owner_decision_required: true
blocked_reason: Daily Telegram reminder delivery requires a product-defined Thailand-local send time and a completion-suppression policy. Existing tasks intentionally leave both decisions open and prohibit inventing delivery behavior.
owner_decision:
  - What Thailand-local time should an enabled daily reminder be sent?
  - If the learner has already completed that day's daily question, should the reminder be skipped?
supervisor_recommendation:
  - Choose a single fixed ICT time and suppress reminders after same-day completion to avoid sending a stale prompt. These are recommendations only and require Product Owner confirmation.
