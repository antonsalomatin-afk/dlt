  - TASK-063
  - TASK-064
owner_decision_required: false
blocked_reason: null
owner_decision:
  - Send enabled daily reminders at 11:00 ICT (UTC+07:00).
  - Do not suppress an enabled reminder after same-day completion; it remains an invitation to do more training.
