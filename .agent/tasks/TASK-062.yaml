id: TASK-062
title: Manage daily reminders in the Mini App
status: READY
epic: Epic 8 — Telegram Engagement
objective: Let an authenticated learner view and change the persisted daily-question reminder preference in the Mini App without implying that delivery is already active.
acceptance:
  - The authenticated Mini App offers a clear reminder-settings entry from setup and ordinary practice while preserving all existing navigation and learning state.
  - Opening reminder settings sends one guarded authenticated GET /me/reminders request and strictly validates the exact accepted preference response.
  - The learner can explicitly enable or disable the preference through one guarded exact PATCH /me/reminders request and sees only server-confirmed state.
  - The view clearly states that Telegram reminder delivery is not active in this implementation slice and does not promise a send time, frequency or notification.
  - Session expiry, transport, HTTP and malformed-response failures are safe and recoverable; duplicate and stale actions cannot overwrite current or unmounted state.
  - Browser and source-level tests cover entry, exact requests, strict validation, enable/disable/idempotence, failures, race guards, truthful wording and regressions.
files_allowed:
  - apps/web/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm build
  - pnpm test:e2e
dependencies:
  - TASK-061
owner_decision_required: false
builder_commit: null
authoritative_checks: null
review_attempt: 0
accepted_commit: null
review_file: null
supervisor_refinement:
  - Add a dedicated authenticated reminder-settings view and accessible Reminder settings actions from setup and ordinary practice. Do not fetch or update reminder state during authentication, vehicle selection or ordinary practice. Returning from the view must preserve the correct setup/practice destination and must not mutate learning state.
  - Add a strict browser schema for exactly `{ dailyQuestionReminderEnabled: boolean }` and only the explicit same-origin `/me/reminders` rewrite. Reuse the same strict schema for GET and PATCH responses; reject missing, non-boolean and extra members.
  - On view entry, send exactly one GET `/me/reminders` request with the in-memory bearer token, no-store caching and the accepted 15-second timeout. Use synchronous busy and mounted/request-identity guards so retries cannot overlap and late success, error or 401 responses after navigation do nothing.
  - Render an accessible loading state followed only by validated server state. Show one explicit checkbox or switch labelled for daily-question reminder preference and concise text that saving the preference records the learner's choice but Telegram delivery is not active yet. Do not display or request time, timezone, frequency, channel, identity or delivery metadata.
  - A learner action sends exactly one PATCH `/me/reminders` JSON request with the captured opposite boolean and bearer token, no-store caching and the accepted timeout. Disable mutation while pending. Update the visible confirmed state only after an exact validated response whose boolean equals the requested value; a mismatch is a retryable failure and keeps the prior confirmed state.
  - The initially loaded value and each confirmed update are authoritative. Repeated enable/disable navigation and remounts reload from the server. Do not persist the preference, token or pending value in local/session storage, cookies, URLs or logs, and do not optimistically claim success.
  - GET or PATCH 401 expires the in-memory session. Transport, timeout, other HTTP and malformed/mismatched success preserve the last confirmed state and provide a deterministic retry path. A failed initial GET exposes no control until retry succeeds. Leaving remains immediate and invalidates pending callbacks.
  - Playwright coverage must prove setup/practice entry and correct return destination; exact GET/PATCH method, body, bearer header and no duplicate requests; default-off and enabled rendering; enable/disable/idempotent remount; pending disablement; transport/HTTP/malformed/mismatched response recovery; 401 expiry; late navigation safety; truthful no-delivery wording; and unchanged onboarding/practice flows. Add focused schema/rewrite source tests.
  - Update concise Mini App documentation. No API, database, authentication, preference semantics, bot command/message, send time, timezone, scheduler/queue, notification delivery, daily assignment, summary, deep link, dependency, credential, production data or deployment change belongs in this task.
