id: TASK-077
title: Answer native Telegram quizzes directly in the private bot chat
status: BUILDING
owner_role: Builder
objective: Add the owner's requested question-and-answer learning flow entirely inside the private Telegram bot chat, without opening the Mini App.
depends_on:
  - TASK-076
owner_request: Explicit request on2026-10-21 with art-group quiz screenshots. References illustrate native Telegram question/options/result/explanation behavior only; no art content or assets are authorized for reuse.
confirmed_scope:
  - Private bot chat remains the destination; the screenshot does not request a public group or channel.
  - Present an existing active VERIFIED driving question and its four real choices using native Telegram quiz behavior; let the learner answer in chat, see correctness/explanation and request the next question there.
  - One language per quiz; English default and preferred language when the complete question/choice text is reviewed and available. Current RU overlay translates stems only, so do not silently mix RU stems with untranslated choices or invent unreviewed translations; coherent English fallback is available.
  - Keep the Mini App and current private EN/RU deep-link reminders functional. Do not silently change scheduled reminder format or subscription preferences; this adds native chat practice.
  - Persist ownership, poll-to-question/choice mapping and authoritative answer results through the existing PostgreSQL/learning model; prevent duplicate credit, foreign answers, stale/replayed updates and lost state across restart. Specify exact semantics before Builder work.
  - Use Telegram quiz feedback behavior rather than imposing Mini App Check answer controls on a native poll. Preserve explicit confirmation in the Mini App.
  - Use an approved associated image only when one exists; current starter bank has none. No copied art-group content, external translation service or fake questions/statistics.
planning_gates:
  - TASK-076 accepted and deployed611a559 with independent code and operational PASS; main includes acceptancebfe3d9f. TASK-077 is now the sole current implementation cycle.
  - Supervisor verifies current official Bot API quiz/non-anonymous answer updates, supported runtimegrammy fields, payload limits and explanation behavior, then refines exact tests/files and any needed persistence/scheduler ADR before READY.
  - Decide a bounded shared answering path instead of duplicating API business rules; document Telegram trusted-update identity and transaction/delivery ambiguity boundaries.
  - Test with injected transports and isolated database; no forced production test message or new polling instance without explicit authorization.
  - Full mock-exam chat sessions, automatic translation and public channel/group statistics are not implied by the supplied single-question examples.
references:
  - https://core.telegram.org/bots/api#sendpoll
  - https://core.telegram.org/bots/api#pollanswer
owner_decision_required: false
adr: .agent/decisions/ADR-007-native-chat-practice.md
acceptance:
  - User can send /quiz or /practice in private chat, choose Car/Motorcycle there if unset, receive a real active VERIFIED question and four native quiz options, answer, read correctness and full explanation, then request Next without opening Mini App. /start retains existing buttons and adds discoverable chat-practice guidance.
  - Reuse saved vehicle/language and same Telegram User identity; never change opt-in or language automatically. Explicit private vehicle choice may set the existing saved vehicle. Reject groups, mismatched chat/from identity, bot users, anonymous/foreign/unbound/invalid answers and malformed callbacks before persistence.
  - Implement the exact durable current-session, bounded sending/ANSWERING leases, uncertain-send/failed-answer explicit replacement, answered-feedback recovery and current-presentation Next semantics in ADR-007. Pre-claim database failure must not acknowledge/lose a valid received vote; post-claim rollback/crash expires to recoverable uncertainty. Committed result always wins. Restart reuses bound unanswered poll; duplicate commands/answers/Next cannot create duplicate credit or multiple current questions. Retain learning history; unknown/stale/retired poll and retraction/multiple/out-of-range votes cannot mutate it.
  - Extract shared practice answer business logic and transaction-safe concept accounting used by API and bot. Preserve every existing HTTP answer status/error/DTO and pre-answer secrecy. Share existing selection/snapshot rules; no forked scoring engine. Test concurrent duplicate transactions and rollback of all related writes.
  - Use non-anonymous quiz with four options and current correct_option_ids, immutable persisted index-to-choice mapping, revoting/multiple/shuffle disabled. Explicitly request message/callback_query/poll_answer updates; no drop_pending_updates or webhook.
  - Coherent English default or fully available preferred language including feedback; RU stem-only bank falls back to English. Safely handle300question/100option/200nativeexplanation/two-linefeed limits without changing meaningful text. Long context/choices and full explanation remain available as plain-text messages, with safely bounded chunks. Approved media only through existing safe validation; no external fetch/content or translations.
  - Add one durable ChatQuizSession model plus additive checked-in migration using existing PostgreSQL. Enforce unique user/current presentation/poll mapping and owned relation at persistence boundary; no schema reset, destructive migration, seed, real-data write, new dependency/env/API route or provider.
  - Meaningful injected-transport unit and real isolated Postgres integration tests cover normal correct/incorrect flow, unset/saved vehicles, locale fallback/full locale, limits, private identity, exact mapping, duplicate/foreign/stale/retracted/out-of-range updates, concurrent commands/answers/Next, normal restart, send/bind ambiguity and feedback recovery. Retain all existing tests; API regression suite verifies extraction preserves contracts.
  - Update README with /quiz usage, recovery/language behavior and rollout migration requirement. Do not deploy or send production messages in Builder role. Supervisor selects publication after code checks/review PASS; no claim of live chat feature until actual reviewed rollout.
files_allowed:
  - apps/bot/src/**
  - apps/api/src/index.ts
  - packages/database/src/**
  - packages/database/prisma/schema.prisma
  - packages/database/prisma/migrations/**
  - tests/**
  - README.md
  - .local-content/task077*
files_forbidden:
  - apps/web/**
  - content/**
  - tools/**
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - .env
  - .agent/** # Supervisor owns state/architecture; request amendment if protocol genuinely needs changes.
required_checks:
  - pnpm lint
  - pnpm typecheck
  - pnpm test --maxWorkers=2
  - pnpm prisma validate
  - pnpm test:integration
  - pnpm build
supervisor_validation_scope:
  - Sequential generated-client generation/consumers only. Full unit338plusnew and full backend integration are authoritative. Web/bearer contracts and source remain unchanged; inherit accepted TASK-076 full229 browser evidence unless shared API responses/behavior differ or any regression requires a focused browser check.
  - Use existing isolated local database tooling and safety checks; inspect before resetting. Never log local .env credentials or use production DATABASE_URL in tests. No polling or real Telegram transport.
  - Maximum3 independent failed reviews. Builder commits scoped source/tests/README only and stops; no task acceptance or main change.

