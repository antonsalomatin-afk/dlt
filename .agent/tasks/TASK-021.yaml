id: TASK-021
title: Deliver questions for a selected category
status: READY
epic: Epic 4 — Learning
objective: Allow authenticated practice delivery to select eligible questions from one requested category.
acceptance:
  - POST /practice/next accepts an optional validated category selector while preserving unfiltered practice compatibility.
  - Category-filtered delivery enforces the saved vehicle and active verified eligibility and retains the accepted server-owned snapshot contract.
  - Unknown or empty eligible categories and malformed selectors have stable tested behavior without leaking content metadata.
  - Integration tests verify category and vehicle isolation, unfiltered regression and snapshot safety.
files_allowed:
  - apps/api/**
  - packages/database/src/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm test:integration
supervisor_refinement_required:
  - Resolved by supervisor_refinement below; no further approval needed within this scope.
dependencies:
  - TASK-020
owner_decision_required: false
supervisor_refinement:
  - Extend the accepted POST /practice/next body to a strict object with one optional categoryId UUID. An absent body and {} retain the current unfiltered behavior. categoryId null, non-UUID, duplicate/array values where applicable and any unknown key return the established400 Bad Request.
  - Preserve route precedence: authenticate first, validate the body second, then require the saved vehicle. Thus invalid credentials remain401 regardless of body, an authenticated malformed body is400, and an authenticated valid request without a selected vehicle is409.
  - Use the category UUID returned by GET /practice/categories. Apply categoryId directly in the same Question database predicate as saved vehicle, active true and verificationStatus VERIFIED. Do not query category existence separately or reveal whether the UUID is unknown, belongs only to another vehicle, or has no eligible questions.
  - Every valid filtered request with no eligible match returns the same existing404 { error: No questions available } and creates no presentation. A valid match retains deterministic question-ID ordering for this slice, the repeatable-read transaction and the exact accepted QuestionPresentation snapshot/response contract.
  - Preserve unfiltered behavior byte-for-byte at the response boundary and do not change answer submission. Before-answer responses must still omit correctness, explanations, source/image metadata and other hidden fields.
  - Add focused body-schema tests if extracted and real PostgreSQL integration coverage for absent body, {}, category match, another category, another vehicle, inactive/draft/rejected questions, unknown UUID, malformed/extra body, no-presentation failure paths, unfiltered regression and immutable snapshot behavior after source edits.
  - Document selector semantics and uniform404 privacy behavior. No category UI, randomization, repeat-avoidance, schema migration, content mutation/activation, new dependency or production credential.
