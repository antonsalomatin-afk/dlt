id: TASK-035
title: Read and resume the current mock exam
status: ACCEPTED
epic: Epic 5 — Mock Exam
objective: Let an authenticated learner safely recover the latest uncompleted mock exam after a Mini App reload without exposing results before completion.
acceptance:
  - A protected current-exam endpoint returns the learner's latest uncompleted active or expired exam with safe immutable questions and persisted answer selections.
  - The response exposes enough authoritative timing and progress state to resume or complete the exam while withholding correctness, answers and explanations.
  - Authentication, ownership, no-current behavior, active/expired state, corruption, privacy and read-only behavior are deterministic and covered against PostgreSQL.
  - The endpoint is documented without changing start, answer, completion, review or history behavior.
files_allowed:
  - apps/api/**
  - packages/database/src/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm prisma validate
  - pnpm test:integration
supervisor_refinement_required:
  - Resolved by supervisor_refinement below; no further approval needed within this scope.
dependencies:
  - TASK-034
owner_decision_required: false
supervisor_refinement:
  - Add GET /exam/current with Cache-Control no-store inside the existing exam bearer-authentication boundary. Authenticate and capture one request time before validating an exactly empty query. Invalid credentials retain uniform401; any query member returns400 Bad Request after valid authentication.
  - Resolve only uncompleted ExamSession rows owned by the authenticated learner, ordered by startedAt descending then id descending. Return the latest row whether active or expired so a reloaded client can continue answering before expiry or call the accepted completion endpoint at/after expiry. If none exists, return404 Exam not found. Other users' sessions must never influence or be disclosed by the result.
  - Detect impossible ambiguity before returning: more than one owned uncompleted session whose expiresAt is strictly after the captured request time fails sanitized500. Multiple older expired uncompleted sessions remain valid historical residue; choose the newest tuple deterministically.
  - Require the accepted50-question,45-pass,60-minute policy, an entirely null completion tuple, and exactly50 unique consecutive ExamQuestion rows. Parse every immutable versioned snapshot and require snapshot question IDs to match persisted questionId values.
  - Validate every answer tuple. Unanswered rows must have selectedChoiceId, isCorrect and answeredAt all null. Answered rows must have all three fields, selectedChoiceId must belong to the snapshot, isCorrect must equal comparison with snapshot.correctChoiceId, and answeredAt must be at or after startedAt and strictly before expiresAt. Any corruption fails the whole request through sanitized500.
  - Return exactly { examId, vehicleType, questionCount, passingScore, startedAt, expiresAt, serverTime, expired, answeredCount, remainingCount, questions }. serverTime is the captured request time in canonical ISO form; expired is true exactly when serverTime is greater than or equal to expiresAt. Counts must sum to50.
  - Each question is ordered by position and contains exactly { examQuestionId, position, selectedChoiceId, answeredAt, question }. The selected fields are both null for unanswered rows and both non-null for answered rows. question is the accepted safe presented snapshot. Validate canonical IDs/timestamps, exact fields, uniqueness, positions and answer pairing at the response boundary.
  - Never expose isCorrect, correctChoiceId, score, passed, explanations, user/session identifiers, source/image metadata or current mutable content. Do not create or mutate ExamSession, ExamQuestion, practice presentations, AnswerAttempt history, favorites or progress.
  - Add unit coverage for the strict response, timing/expired/count invariants, ordered identities, nullable answer pairing and privacy. Add isolated PostgreSQL coverage for auth-before-query validation, no-current and ownership isolation, active and exact-expiry responses, deterministic latest expired selection, impossible multiple-active failure, partial completion and malformed policy/snapshot/answer/cardinality failure, immutable content after source edits, exact response privacy and proof of no writes or practice side effects.
  - Update README. No schema migration, exam start/answer/completion/review/history contract change, automatic completion, Mini App UI, production content, dependency, credential or deployment change.
accepted_commit: 8cf61dc8d382dd03f2b4ba581da0ffa6b6fb7581
