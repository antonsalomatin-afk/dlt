id: TASK-035
title: Take a timed mock exam in the Mini App
status: ACCEPTED
epic: Epic 5 — Mock Exam
objective: Let an authenticated learner start the accepted 50-question timed mock exam, answer its questions without correctness disclosure, and finish it to see the authoritative score and pass result in the Mini App.
acceptance:
  - Mock exam is reachable from vehicle setup (after a saved vehicle) and from practice, and Back returns to the opening origin.
  - Starting sends exactly one POST /exam/start; the Mini App validates the strict start contract and presents the 50 positioned questions one at a time with a countdown to expiresAt and answered/remaining counts.
  - Answering sends exactly POST /exam/answer { examQuestionId, choiceId } for the visible unanswered question, validates the strict response, never shows correctness, and handles already-submitted, expired, completed, not-found, transport and malformed outcomes safely.
  - Finishing sends POST /exam/complete { examId } only when all questions are answered or time is up, validates the strict summary and renders score, passing score, answered/unanswered counts and pass result.
  - Loading, retry, expired-session (401), vehicle-required (409), in-progress (409), insufficient-questions (404), stale-response and departure behavior is accessible, safe and recoverable, and browser tests cover it while all existing suites stay green.
files_allowed:
  - apps/web/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm build
  - pnpm test:e2e
dependencies:
  - TASK-034
owner_decision_required: false
supervisor_refinement:
  - Add explicit same-origin rewrites for POST /exam/start, /exam/answer and /exam/complete only. Use the in-memory bearer token, JSON bodies, cache no-store and the established15-second timeout. Never persist or render the credential.
  - Add strict browser contracts mirroring the accepted API responses. Start requires exactly50 questions with consecutive positions, unique exam-question and question IDs and a60-minute window. Answer requires the identity examId/examQuestionId/selectedChoiceId and counts totalling50. Completion requires counts totalling50, score not above answeredCount and passed agreeing with score and passingScore. Reject unknown members before rendering.
  - The Exam view opens on an intro that states the policy (50 questions,60 minutes, pass at45) and a Start exam action. Start sends {} once with an overlap guard;409 Vehicle selection required returns to setup through the established path;409 Exam already in progress and404 Not enough questions available show specific guidance with retry; other failures show generic retry guidance.
  - During the exam show the question at the current position with localized wording (English default, Russian/Thai falling back to English), the four choices, Previous/Next navigation over all50 positions, a live countdown derived from expiresAt and the request-time clock, and Answered/Remaining counts derived from the persisted answer responses. Submitted questions stay visibly locked with Your answer marked; no correct answer or explanation is ever shown before completion.
  - Answer409 Answer already submitted locks that question locally and continues;409 Exam expired enters the time-up state;409 Exam already completed requests completion to show the persisted result;404 shows retry guidance for that question. A selected choice stays selected after a failure so Retry answer resends the same IDs.
  - When the countdown reaches zero or the server reports expiry, disable answering and offer Finish exam. Finish is otherwise enabled only when answeredCount equals50.409 Exam incomplete shows the remaining count. The result view shows Score, Passing score, Answered, Unanswered and Passed/Not passed, with a Back action and a Start another exam action that remounts the intro.
  - A401 anywhere expires and clears the session through the established path. Leaving the exam view is immediate and invalidates every in-flight request lifecycle; a fresh mount starts on the intro and nothing is persisted in browser storage.
  - Add Playwright coverage for exact start/answer/complete request bodies and auth; strict malformed rejections with retry; question navigation, locked answered questions and counters; already-submitted, expired and completed409 handling; time-up via the test clock; incomplete409 and successful completion rendering; in-progress and insufficient start guidance; vehicle-required and401 paths; setup and practice origins; departure ignoring a late response. Keep all existing E2E suites green.
  - Update README. No backend/API change, exam review or history screens, resume of an existing exam, offline persistence, dependency, production credential or deployment change.
