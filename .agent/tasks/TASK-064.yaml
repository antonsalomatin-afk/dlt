supervisor_refinement:
  - Add a dedicated authenticated language-settings view and accessible Language settings actions from setup and ordinary practice. Do not fetch or update language during authentication, vehicle selection or ordinary practice. Returning preserves the setup/practice destination and does not mutate learning state.
  - Add a strict browser schema for exactly `{ preferredLanguage: 'ENGLISH' | 'RUSSIAN' | 'THAI' }` and only the explicit same-origin `/me/language` rewrite. Reject missing, unsupported, wrong-case, non-string and extra members.
  - On view entry, send exactly one GET `/me/language` request with the in-memory bearer token, no-store caching and the accepted 15-second timeout. Use synchronous busy and mounted/request-identity guards so retries cannot overlap and late callbacks after navigation do nothing.
  - Render an accessible loading state followed only by validated server state. Present exactly English, Russian and Thai as radio/select options, with the confirmed value selected. Explain that the preference will be used for future messages and that current practice, history, progress and exam selectors remain independent.
  - Saving sends exactly one PATCH `/me/language` JSON request with the captured selected enum, bearer token, no-store caching and the accepted timeout. Disable mutation while pending. Update confirmed state only after an exact validated response equal to the requested value; mismatch is retryable and preserves prior confirmation.
  - Do not send PATCH when the selected value equals the last confirmed value. After successful save, allow another language selection. Fresh remounts reload server state. Persist no language, token or pending state in browser storage, cookies, URLs or logs.
  - GET or PATCH 401 expires the in-memory session. Transport, timeout, other HTTP and malformed/mismatched success preserve the last confirmed state with deterministic retry. Failed initial GET exposes no options until retry. Leaving remains immediate and invalidates pending callbacks.
  - Playwright coverage must prove setup/practice entry and return destination; exact GET/PATCH method, body, bearer header and duplicate guards; English default plus Russian and Thai saves; unchanged-value no request; pending disablement; transport/HTTP/malformed/mismatch recovery; 401 expiry; late navigation safety; truthful scope wording; and unchanged onboarding/practice behavior. Add focused schema/rewrite tests.
  - Update concise Mini App documentation. No API, database, authentication, Telegram message, reminder timing, scheduler/queue, notification delivery, automatic screen-language synchronization, deep link, dependency, credential, production data or deployment change belongs in this task.
