id: TASK-064
title: Manage preferred language in the Mini App
status: ACCEPTED
epic: Epic 8 — Telegram Engagement
objective: Let an authenticated learner view and change the persisted English, Russian or Thai preference used for future messages.
acceptance:
  - The authenticated Mini App offers a clear language-settings entry from setup and ordinary practice while preserving all existing navigation and learning state.
  - Opening language settings sends one guarded authenticated GET /me/language request and strictly validates the exact accepted response.
  - The learner can select English, Russian or Thai and save it through one guarded exact PATCH /me/language request, seeing only server-confirmed state.
  - The view clearly states that this preference is for future messages and does not automatically change existing per-screen language selectors.
  - Session expiry, transport, HTTP and malformed-response failures are safe and recoverable; duplicate and stale actions cannot overwrite current or unmounted state.
  - Browser and source-level tests cover entry, exact requests, strict validation, all languages, idempotence, failures, race guards, truthful wording and regressions.
files_allowed:
  - apps/web/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm build
  - pnpm test:e2e
dependencies:
  - TASK-063
owner_decision_required: false
owner_decision:
  - Use the learner's persisted preferred language for messages, with English as the default.
