id: TASK-003
title: Add local PostgreSQL development environment
epic: Epic 0 — Agent Harness
status: BUILDING
priority: P1

objective: >
  Provide a reproducible local PostgreSQL development environment and environment
  variable convention, without defining the application schema yet.

context:
  - PostgreSQL is accepted in ADR-002.
  - Prisma schema belongs to the next data-foundation task.

acceptance:
  - A local PostgreSQL instance can be started using documented project commands.
  - Use a project-local native PostgreSQL development runner because Docker is unavailable on this host; Docker Compose is optional.
  - `.env.example` documents required database variables with non-secret examples.
  - Real `.env` files are gitignored.
  - A health/readiness mechanism exists for local PostgreSQL.
  - README documents start/stop/reset commands.
  - No production credentials or production deployment configuration is introduced.

non_goals:
  - Do not define the final Prisma schema.
  - Do not create production infrastructure.
  - Do not add Redis.

files_allowed:
  - compose*.yml
  - docker-compose*.yml
  - .env.example
  - .gitignore
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tsconfig*.json
  - tests/**
  - README.md
  - tools/**

files_forbidden:
  - apps/web/**
  - apps/bot/**
  - content/**

required_tests:
  - Local database start, readiness, stop and reset commands execute successfully on this Windows host without Docker.
  - Configuration syntax is valid.
  - Lifecycle commands reject invalid configuration and reset is confined to the documented project-local development data directory.

required_checks:
  - pnpm check

dependencies:
  - TASK-002

security_notes:
  - Example credentials must be local-development-only.
  - Real secrets must remain ignored.

documentation:
  - README.md

commit_hint: "chore(db): add local PostgreSQL environment"

owner_decision_required: false

supervisor_refinement:
  - embedded-postgres may supply real native PostgreSQL binaries as a devDependency; pin the version and narrowly permit required install scripts.
  - Bind database to loopback only. Keep data in a gitignored fixed project-local directory.
  - Never create OS users or services. Avoid dependence on admin privileges.
  - Validate environment ports and config; never print credentials. Document local-only defaults in .env.example.
  - Ensure lifecycle tooling is included in strict typecheck and lint; cover meaningful error paths.
  - Prefer a small native lifecycle helper over implementing two untestable provisioning paths.
  - Supervisor will run the lifecycle independently before acceptance.
