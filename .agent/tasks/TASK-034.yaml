id: TASK-034
title: List authenticated mock-exam history
status: ACCEPTED
epic: Epic 5 — Mock Exam
objective: Let an authenticated learner page through authoritative summaries of their completed mock exams.
acceptance:
  - A protected history endpoint returns only the authenticated learner's completed exams, newest first, with bounded keyset pagination.
  - Every returned summary is revalidated from the fixed exam policy, immutable snapshots and answer tuples before exposing score, pass and answer counts.
  - Authentication, strict query/cursor behavior, ownership isolation, empty history, stable ordering, corruption and privacy are deterministic and covered against PostgreSQL.
  - The endpoint is documented and read-only, with no exam or practice side effects.
files_allowed:
  - apps/api/**
  - packages/database/src/**
  - tests/**
  - README.md
required_checks:
  - pnpm check
  - pnpm prisma validate
  - pnpm test:integration
supervisor_refinement_required:
  - Resolved by supervisor_refinement below; no further approval needed within this scope.
dependencies:
  - TASK-033
owner_decision_required: false
supervisor_refinement:
  - Add GET /exam/history with Cache-Control no-store inside the existing bearer-authenticated exam boundary. Authenticate before parsing the query. Accept only optional limit and cursor keys. limit defaults to20 and must be an unpadded unsigned decimal integer from1 through50; reject duplicate, empty, signed, fractional, padded, unknown or otherwise malformed values with400 Bad Request after valid authentication.
  - Return the strict envelope { items, nextCursor }. Include only completed ExamSession rows owned by the authenticated user. Order by startedAt descending then id descending, fetch limit plus one, and use deterministic keyset conditions strictly after the cursor tuple. Empty history returns { items: [], nextCursor: null }.
  - Use a canonical unpadded base64url UTF-8 JSON cursor with exact shape { v: 1, startedAt: canonical ISO timestamp, examId: canonical lowercase UUID }. Bound encoded input to512 characters and reject decoding, UTF-8, JSON, schema or canonical re-encoding failures with400. Cursor contents are navigation data only and never relax ownership.
  - Each item is exactly { examId, vehicleType, questionCount, answeredCount, unansweredCount, score, passingScore, passed, startedAt, completedAt }. Require the accepted50-question,45-pass,60-minute policy; exactly50 unique consecutive ExamQuestion rows; one complete completion tuple; and canonical response IDs/timestamps.
  - Revalidate every returned session from immutable versioned snapshots and answer tuples exactly as completion/review do. Snapshot question IDs, selected-choice membership, correctness and answer timing must agree. Recompute answeredCount, unansweredCount, score and passed, require them to match the persisted completion result, and reject early completion with unanswered rows. Any malformed returned session fails the whole request through the sanitized500 response.
  - Never read or expose current mutable Question or QuestionChoice content. Do not expose per-question content, choices, correctness, explanations, source/image metadata, user/session identifiers or database internals. The endpoint is read-only and must not create or mutate ExamSession, ExamQuestion, practice presentations, AnswerAttempt history, favorites or progress.
  - Add focused unit coverage for strict query/cursor encoding and response invariants. Add isolated PostgreSQL coverage for auth-before-query behavior, malformed queries/cursors, empty history, completed-only ownership isolation, deterministic tie ordering and two-page traversal without duplicates on unchanged data, vehicle and pass/fail summaries, immutable revalidation after source edits, malformed policy/snapshot/answer/cardinality/completion failure, exact privacy and proof of no writes or practice side effects.
  - Update README. No schema migration, exam start/answer/completion/review contract change, in-progress exam resume, Mini App UI, generic pagination framework, production content, dependency, credential or deployment change.
