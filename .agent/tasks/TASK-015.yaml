id: TASK-015
title: Verify the local Mini App vertical slice end to end
status: BUILDING
epic: Epic 3 — Question Vertical Slice
objective: Exercise the browser, Next proxy, Fastify authentication and PostgreSQL together without production credentials.
acceptance:
  - An isolated local test harness starts real web/API processes and a fresh test-owned database with the full migration chain.
  - Harness creates synthetic test-only verified questions and signed initData using a synthetic server token; browser mocks only the Telegram bridge, not API responses.
  - Browser signs in, selects a vehicle, receives a question, submits an answer, sees the authoritative result/explanation and continues.
  - Database assertions verify authenticated user preference, owned presentation and exactly one scored answer; HTTP paths exercise actual rewrites.
  - Test cleanup stops only owned processes and removes only its isolated database, including failure paths. No fixtures in the normal database are activated.
  - No test credential or bypass path is introduced in production app code. Document repeatable local execution and distinguish synthetic testing from live Telegram validation.
files_allowed:
  - tests/**
  - playwright*.ts
  - package.json
  - pnpm-lock.yaml
  - README.md
  - .gitignore
required_checks:
  - pnpm check
  - pnpm build
  - pnpm test:e2e
  - pnpm test:integration
  - pnpm test:fullstack
supervisor_refinement_required:
  - Resolved by supervisor_refinement below; no further approval needed within this scope.
dependencies:
  - TASK-014
owner_decision_required: false

supervisor_refinement:
  - Provide pnpm test:fullstack as a distinct opt-in local browser gate; preserve the existing mocked browser suite. Use dedicated loopback ports3100(web) and3101(API), failing clearly if either is occupied without terminating unrelated processes.
  - Build the web app with API_ORIGIN=http://127.0.0.1:3101 for this harness and pass the web port explicitly at startup. Document that subsequent normal local use must rebuild with its intended API_ORIGIN.
  - Create a cryptographically random database name under a fixed test prefix using the existing local PostgreSQL service. Apply migrations and seed only that database; pass its URL and a synthetic bot token only to the owned API child environment.
  - Start API with API_PORT3101 and web with port3100; wait for bounded readiness and capture safe diagnostics without logging credentials. The browser receives test-generated signed initData solely through the mocked official bridge script; never intercept API requests.
  - Verify a correct and incorrect answer, persisted preference and exactly one answer per presentation via the test database; capture a mobile result screenshot for visual inspection.
  - In finally/teardown close browser and owned services, await their exit, disconnect clients and drop only the exact created database. Validate the generated database identifier before SQL interpolation; no broad resets or unrelated process termination.
  - Add pnpm test:fullstack to this task required gates; setup failures must fail visibly rather than silently skip tests. Keep full-stack test files excluded from the ordinary unit/integration suites where needed within allowed scope.
