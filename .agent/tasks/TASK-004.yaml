id: TASK-004
title: Create Prisma database package and initial user model
epic: Epic 1 — Data Foundation
status: ACCEPTED
priority: P1

objective: >
  Introduce Prisma in the shared database package and define the initial User model
  needed for Telegram authentication.

context:
  - PostgreSQL local environment exists.
  - Keep the first schema intentionally small.

acceptance:
  - `packages/database` exists as a workspace package.
  - Prisma is configured for PostgreSQL.
  - User has an internal primary key.
  - Telegram user id is stored and uniquely constrained.
  - Optional username and first name are supported.
  - createdAt and updatedAt are stored.
  - lastSeenAt can be stored.
  - selected vehicle type may be nullable until onboarding.
  - A migration is generated and applies cleanly.
  - Prisma client is generated through documented commands.
  - Basic integration test verifies user persistence and Telegram id uniqueness.

non_goals:
  - Do not add questions yet.
  - Do not add sessions/auth tokens yet.
  - Do not add payments or referrals.

files_allowed:
  - packages/database/**
  - package.json
  - pnpm-lock.yaml
  - tsconfig*.json
  - eslint.config.*
  - vitest*.config.*
  - .gitignore
  - pnpm-workspace.yaml
  - .env.example
  - README.md
  - tests/**

files_forbidden:
  - apps/web/**
  - apps/bot/**
  - content/**

required_tests:
  - Can create a User.
  - Duplicate Telegram user id is rejected or handled according to unique constraint.

required_checks:
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm prisma validate
  - pnpm test:integration

dependencies:
  - TASK-003

security_notes:
  - Do not store Telegram auth payloads unnecessarily.

documentation:
  - README.md
  - .agent/ARCHITECTURE.md only if implementation materially diverges

commit_hint: "feat(db): add Prisma user model"

owner_decision_required: false

supervisor_refinement:
  - Store Telegram ids as PostgreSQL bigint/Prisma BigInt to preserve identity beyond 32 bits.
  - Include nullable CAR/MOTORCYCLE vehicle enum as already specified by architecture.
  - Generated client output is ignored, not handwritten or committed; generation must be reproducible from a fresh checkout.
  - Include new package source and tests in strict typecheck and lint; narrowly ignore only generated code.
  - Integration command must run real PostgreSQL tests, fail if unavailable, and never silently skip.
  - Integration tests must isolate their records/schema and clean up only test-owned data; no broad destructive reset of application tables.
  - Demonstrate fresh migration apply and repeated deploy no-op using the local database. Do not add production deployment.
  - Pin compatible Prisma CLI/client/adapter versions; use official documentation matching the selected release.


accepted_commit: 8de115fe6cbe0a9f8ff10e2f44d6176378dcf14e
review_file: .agent/reviews/TASK-004-review-01.md
