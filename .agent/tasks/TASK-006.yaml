id: TASK-006
title: Add 25 fixture questions and import command
epic: Epic 1 — Data Foundation
status: BUILDING
priority: P1

objective: >
  Create a small, explicit development fixture dataset and a repeatable import path
  so the question engine can be built without mixing product coding with large-scale
  content acquisition.

context:
  - Fixtures are development/testing content, not a claim of an official complete DLT bank.

acceptance:
  - Exactly 25 development fixture questions exist.
  - Fixture categories cover at least signs, traffic law, safe driving, vehicle maintenance and hazard perception.
  - Both CAR and MOTORCYCLE are represented where appropriate.
  - Fixture format is human-reviewable (JSON/YAML/TS data as refined by Supervisor).
  - Import validates structure before writing.
  - Re-running import is deterministic/idempotent or has explicitly documented reset behavior.
  - Source metadata clearly marks fixture/development provenance.
  - At least one question includes Thai, exam-style English, normalized English and Russian.
  - Tests cover malformed fixture rejection and successful import.

non_goals:
  - Do not scrape external sites.
  - Do not claim fixtures are official DLT questions.
  - Do not add hundreds of questions yet.
  - Do not add AI generation.

files_allowed:
  - content/**
  - packages/database/**
  - packages/shared/**
  - tools/**
  - package.json
  - pnpm-lock.yaml
  - tsconfig*.json
  - README.md
  - tests/**

files_forbidden:
  - apps/web/**
  - apps/bot/**

required_tests:
  - Valid fixture import succeeds.
  - Malformed fixture fails validation.
  - Repeated import behavior matches documented policy.

required_checks:
  - pnpm lint
  - pnpm typecheck
  - pnpm test
  - pnpm test:integration

dependencies:
  - TASK-005

security_notes: []

documentation:
  - README.md
  - content/README.md

commit_hint: "feat(content): add development question fixtures"

owner_decision_required: false

supervisor_refinement:
  - Use human-reviewable JSON for exactly25 original synthetic development questions; do not scrape or claim official DLT wording/legal verification.
  - Mark sourceType FIXTURE with explicit development provenance; import as inactive DRAFT without pretending AI/human legal review occurred.
  - Validate the entire unknown input before any writes, including exactly25 questions, five required categories, both vehicles, unique stable IDs, nonempty required text, exactly A/B/C/D once each and exactly one correct choice.
  - At least one question supplies all four wording fields and localized choices/explanations. Exam-English field must be labelled synthetic, not official.
  - Use stable fixture IDs and namespace; repeated imports preserve IDs/counts and never overwrite nonfixture questions or delete unrelated records.
  - Use a transaction for the whole import so conflicts/failures cannot leave partial data.
  - Expose a documented local-only CLI command; validate destination as loopback using existing local database configuration convention.
  - Integration tests run the real import, repeat it, prove malformed rejection/no partial writes and preservation of unrelated records; clean only test-owned data.
  - No network content acquisition, runtime AI integration, production writes or activation of fixtures in this task.
