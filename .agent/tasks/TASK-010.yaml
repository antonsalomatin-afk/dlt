id: TASK-010
title: Persist authenticated vehicle selection
status: PLANNED
epic: Epic 3 — Question Vertical Slice
priority: P1
objective: Allow a logged-in user to choose CAR or MOTORCYCLE for practice.
acceptance:
  - PATCH /me/vehicle requires a valid session and a strict vehicleType request.
  - CAR and MOTORCYCLE persist only on the authenticated User and are reflected by GET /me.
  - Invalid payloads and unauthorized calls cause no writes and return sanitized stable errors.
  - Response uses the existing validated user DTO.
files_allowed:
  - apps/api/**
  - tests/**
  - README.md
non_goals:
  - No question delivery, UI or new database schema.
required_tests:
  - Select/change vehicle, retrieve preference, reject invalid/missing/extra fields and unauthorized requests.
required_checks:
  - pnpm check
  - pnpm test:integration
dependencies:
  - TASK-009
owner_decision_required: false
commit_hint: 'feat(onboarding): persist vehicle selection'

supervisor_refinement:
  - Request body is exactly {vehicleType: CAR or MOTORCYCLE}; all other values, missing fields and extra fields return400 {error: Bad Request} for authenticated requests.
  - Missing, malformed, unknown, revoked and expired bearer sessions return401 {error: Unauthorized}, consistent with GET /me.
  - Successful response is200 with the existing user DTO directly, with Cache-Control no-store.
  - Reuse the accepted session validation behavior without changing expiry, identity or login contracts.
  - Integration tests cover both vehicles, changing preference, GET /me persistence, two-user isolation and unchanged records for rejected requests.
  - Keep errors sanitized and validate response DTOs; do not introduce frontend work or schema changes.
